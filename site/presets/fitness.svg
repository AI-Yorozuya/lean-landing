  <g transform="rotate(-18 600 500)">
    <rect x="420" y="470" width="360" height="40" rx="20" fill="#5f6f68"/>
    <rect x="360" y="400" width="70" height="180" rx="22" fill="#31413a"/>
    <rect x="770" y="400" width="70" height="180" rx="22" fill="#31413a"/>
    <rect x="300" y="430" width="52" height="120" rx="18" fill="#4c8a6b"/>
    <rect x="848" y="430" width="52" height="120" rx="18" fill="#4c8a6b"/>
  </g>
  <!-- 水壺 -->
  <g transform="rotate(8 950 560)">
    <rect x="905" y="470" width="90" height="180" rx="26" fill="#4c8a6b"/>
    <rect x="925" y="440" width="50" height="36" rx="10" fill="#31413a"/>
    <rect x="905" y="530" width="90" height="26" fill="#dfeae4" opacity=".55"/>
