<!--
  一頁式官網——內容唯一正本。

  ┌─ 想改東西？跟 AI 說這些名字就好 ────────────────────────┐
  │  招牌 brand          左上角的店名（分頁圖示也跟著它）      │
  │  導覽列 nav          最上面那條；小聯絡鈕 nav cta 在右邊   │
  │  選單鈕 menu button  手機版左下角那顆圓的                  │
  │  主視覺區 hero       第一眼看到的整塊                      │
  │    ├ 主標 hero title       最大那句話                      │
  │    ├ 副標 hero text        主標下面那段                    │
  │    ├ 主鈕 hero cta         整頁最重要的那顆按鈕            │
  │    └ 主圖 hero image       右邊（手機版在上面）那張圖      │
  │  亮點區 features     三張卡；每張＝卡標題＋卡說明          │
  │  關於區 about        往下那段自我介紹                      │
  │  頁尾 footer         最下面那條                            │
  └────────────────────────────────────────────────────────┘
  例：「主標改成『十年手工麵包』」「主鈕改成加 LINE」「手機版把亮點區排到主視覺前面」
  ▸ 想在畫面上直接看到這些名字：網址後面加 #labels（例 http://localhost:8788/#labels）。
    拿掉就恢復乾淨——這是看的開關，不會被部署上線。

  三刀口（AI 的編輯紀律）：
  ・改內容＝本檔（招牌/CTA 散多處，改完 grep 全出現點）
  ・換氣質＝style.css 最上面的設定區（四個 block 全換）
  ・動骨架＝layout-desktop.css／layout-mobile.css（桌機手機各自打造，改一邊不波及另一邊）
-->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 【招牌】瀏覽器分頁上的名字 -->
  <title>你的招牌</title>
  <!-- 【招牌首字】分頁圖示＝招牌第一個字＋氣質主色（分頁就是門牌，不掛別人的招牌）。
       換招牌時一起換：把 %E4%BD%A0 換成新首字的 URL 編碼（python3 -c "import urllib.parse;print(urllib.parse.quote('暖'))"）；
       換氣質時把 %23 後六碼換成該氣質的 --accent。 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f5d8a'/%3E%3Ctext x='32' y='34' font-size='38' fill='%23ffffff' text-anchor='middle' dominant-baseline='central' font-family='sans-serif'%3E%E4%BD%A0%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./style.css" />
  <!-- 兩版 layout：桌機一版、手機一版，各自做好——不是一版硬縮 -->
  <link rel="stylesheet" href="./layout-desktop.css" media="(min-width: 768px)" />
  <link rel="stylesheet" href="./layout-mobile.css" media="(max-width: 767.98px)" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
</head>
<body>

<!-- ══ 導覽列 nav ══ -->
<header class="nav">
  <!-- 招牌 brand -->
  <a class="brand" data-name="招牌 brand" href="#top">你的招牌</a>
  <nav class="links" data-name="導覽列 nav" id="links">
    <!-- 導覽連結 nav links -->
    <a href="#features">亮點</a>
    <a href="#about">關於</a>
    <!-- 小聯絡鈕 nav cta：href 換成 tel:0912345678／https://line.me/…／mailto: -->
    <a class="cta-sm" data-name="小聯絡鈕 nav cta" href="mailto:hello@example.com">聯絡我</a>
  </nav>
  <!-- 選單鈕 menu button（只有手機版看得到，固定在左下）-->
  <button class="burger" data-name="選單鈕 menu button" id="burger" aria-label="選單" aria-expanded="false">≡</button>
</header>

<main id="top">

  <!-- ══ 主視覺區 hero ══ -->
  <section class="hero" data-name="主視覺區 hero">
    <div class="hero-text">
      <!-- 主標 hero title：一句話說清楚替誰解決什麼（教練代擬，玩家點頭） -->
      <h1 data-name="主標 hero title">一句話說清楚，你替誰解決什麼。</h1>
      <!-- 副標 hero text -->
      <p class="lede" data-name="副標 hero text">把你最想讓人知道的一段話放這裡——你是誰、為什麼值得信任。</p>
      <!-- 主鈕 hero cta（整頁最重要的一顆，只有一種動作）-->
      <a class="cta" data-name="主鈕 hero cta" href="mailto:hello@example.com">聯絡我</a>
    </div>
    <div class="hero-art" data-name="主圖 hero image">
      <!-- 【主視覺】換玩家的照片：整段 svg 換成 <img src="./你的檔名.jpg" alt="你的招牌">
           行業對得上就先掛 ./presets/ 的預設照。內建 SVG 用主題 token 上色，換氣質自己跟著變。 -->
      <svg viewBox="0 0 400 400" role="img" aria-label="你的招牌">
        <circle cx="230" cy="150" r="120" fill="var(--accent)" opacity=".14" />
        <circle cx="230" cy="150" r="74" fill="var(--accent)" opacity=".22" />
        <rect x="40" y="196" width="250" height="150" rx="18" fill="var(--surface)" stroke="var(--line)" />
        <rect x="66" y="226" width="112" height="11" rx="5.5" fill="var(--accent)" />
        <rect x="66" y="252" width="196" height="8" rx="4" fill="var(--muted)" opacity=".32" />
        <rect x="66" y="272" width="160" height="8" rx="4" fill="var(--muted)" opacity=".32" />
        <rect x="66" y="302" width="84" height="24" rx="12" fill="var(--accent)" />
        <circle cx="316" cy="286" r="30" fill="var(--accent)" opacity=".16" />
      </svg>
    </div>
  </section>

  <!-- ══ 亮點區 features：三張平行賣點，不是步驟——所以不編號 ══ -->
  <section id="features" class="features" data-name="亮點區 features">
    <article class="card" data-name="亮點卡 card">
      <!-- 亮點卡 card：卡標題 card title ＋ 卡說明 card text（每張 ≤ 40 字）-->
      <h3>亮點一</h3>
      <p>你最強的一件事，用客人聽得懂的話講。</p>
    </article>
    <article class="card">
      <h3>亮點二</h3>
      <p>第二個讓人選你的理由。</p>
    </article>
    <article class="card">
      <h3>亮點三</h3>
      <p>第三個。三張剛好，別貪多。</p>
    </article>
  </section>

  <!-- ══ 關於區 about ══ -->
  <section id="about" class="about" data-name="關於區 about">
    <!-- 關於標題 about title -->
    <h2>關於 你的招牌</h2>
    <!-- 關於內文 about text -->
    <p>把你最想讓人知道的一段話放這裡——你是誰、為什麼值得信任。</p>
    <!-- 次要鈕 about cta（外框樣式，比主鈕安靜）-->
    <a class="cta ghost" href="mailto:hello@example.com">聯絡我</a>
  </section>

</main>

<!-- ══ 頁尾 footer ══ -->
<footer class="foot" data-name="頁尾 footer">
  <span>© 你的招牌</span>
  <a class="made" href="https://aiyorozuya.com/learn" target="_blank" rel="noopener">用 AI 萬事屋做的 🐻</a>
</footer>

<script src="./script.js"></script>
</body>
</html>
